name: Check hosts (reusable)
on:
  workflow_call:
    inputs:
      cand:
        description: Candidate lock to test (full, dual or single)
        required: true
        type: string
      hosts:
        description: JSON list of {host, system}
        required: true
        type: string
      mode:
        description: "eval = only evaluate each host, build = build each host"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.cand }} / ${{ matrix.entry.host }}
    runs-on: ${{ matrix.entry.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        entry: ${{ fromJson(inputs.hosts) }}
    steps:
      - name: Nothing but Nix (reclaim disk space for /nix)
        if: matrix.entry.system == 'x86_64-linux'
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "cleave"

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: actions/download-artifact@v4
        with:
          name: locks
          path: locks

      - name: Apply candidate lock
        run: cp "locks/${{ inputs.cand }}.lock" flake.lock

      - name: Check host (retry on transient download errors)
        env:
          MODE: ${{ inputs.mode }}
          HOST: ${{ matrix.entry.host }}
        run: |
          attr=".#nixosConfigurations.${HOST}.config.system.build.toplevel"
          for i in 1 2 3; do
            if [ "$MODE" = build ]; then
              nix build --no-link --print-build-logs "$attr" && exit 0
            else
              nix eval --raw "${attr}.drvPath" > /dev/null && exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          exit 1

name: Auto bump flake.lock
on:
  schedule:
    - cron: "0 6 1,16 * *"
  workflow_dispatch:
concurrency:
  group: bump-flake-lock
  cancel-in-progress: false
permissions:
  contents: read   # pushing is done by the GitHub App token, not GITHUB_TOKEN

jobs:
  # Build three candidate lock files (full, nixpkgs+unstable, nixpkgs only)
  # and list the hosts with their architecture.
  prepare:
    name: Prepare candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
      count: ${{ steps.hosts.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: List hosts and architectures
        id: hosts
        run: |
          hosts=$(nix eval --json --apply 'cs: builtins.attrValues (builtins.mapAttrs (name: c: { host = name; system = c.config.nixpkgs.hostPlatform.system; }) cs)' .#nixosConfigurations)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$hosts" | jq length)" >> "$GITHUB_OUTPUT"

      - name: Create candidate lock files
        run: |
          mkdir locks
          nix flake update || git restore flake.lock
          cp flake.lock locks/full.lock
          git restore flake.lock
          nix flake update nixpkgs nixpkgs-unstable || git restore flake.lock
          cp flake.lock locks/dual.lock
          git restore flake.lock
          nix flake update nixpkgs || git restore flake.lock
          cp flake.lock locks/single.lock
          git --no-pager diff --stat

      - uses: actions/upload-artifact@v4
        with:
          name: locks
          path: locks/

  # Build every host with every candidate lock, each on a native runner.
  check:
    name: ${{ matrix.cand }} / ${{ matrix.entry.host }}
    needs: prepare
    runs-on: ${{ matrix.entry.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cand: [full, dual, single]
        entry: ${{ fromJson(needs.prepare.outputs.hosts) }}
    steps:
      - name: Nothing but Nix (reclaim disk space for /nix)
        if: matrix.entry.system == 'x86_64-linux'
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "cleave"

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: actions/download-artifact@v4
        with:
          name: locks
          path: locks

      - name: Apply candidate lock
        run: cp locks/${{ matrix.cand }}.lock flake.lock

      - name: Build host
        run: |
          nix build --no-link --print-build-logs \
            ".#nixosConfigurations.${{ matrix.entry.host }}.config.system.build.toplevel"

      - name: Mark success
        run: |
          mkdir ok
          touch "ok/ok-${{ matrix.cand }}-${{ matrix.entry.host }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ok-${{ matrix.cand }}-${{ matrix.entry.host }}
          path: ok/

  # Pick the most complete candidate where every host passed, then push it.
  push:
    name: Commit and push flake.lock
    needs: [prepare, check]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@v4
        with:
          name: locks
          path: locks

      - uses: actions/download-artifact@v4
        with:
          pattern: ok-*
          path: ok
          merge-multiple: true

      - name: Pick candidate
        id: pick
        env:
          COUNT: ${{ needs.prepare.outputs.count }}
        run: |
          ls ok || true
          for cand in full dual single; do
            n=$(ls ok 2>/dev/null | grep -c "^ok-${cand}-" || true)
            if [ "$n" -eq "$COUNT" ]; then
              case $cand in
                full)   msg="chore(deps): update flake.lock (all inputs)" ;;
                dual)   msg="chore(deps): update flake.lock (nixpkgs + nixpkgs-unstable)" ;;
                single) msg="chore(deps): update flake.lock (nixpkgs only)" ;;
              esac
              cp "locks/$cand.lock" flake.lock
              echo "message=$msg" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No candidate passed on all $COUNT hosts"
          exit 1

      - name: Commit and push flake.lock
        env:
          MSG: ${{ steps.pick.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add flake.lock
          if git diff --cached --quiet -- flake.lock; then
            echo "No changes to commit"
            exit 0
          fi

          git commit --no-verify --signoff -m "$MSG"

          for i in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push failed (attempt $i), rebasing onto origin/main..."
            git pull --rebase origin main
          done
          exit 1
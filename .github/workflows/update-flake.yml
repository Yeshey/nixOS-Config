name: Auto bump flake.lock
on:
  schedule:
    - cron: "0 6 1,16 * *"
  workflow_dispatch:
concurrency:
  group: bump-flake-lock
  cancel-in-progress: true
permissions:
  contents: read   # pushing is done by the GitHub App token, not GITHUB_TOKEN
jobs:
  bump:
    name: Bump flake.lock
    runs-on: ubuntu-latest
    # environment: bump   # uncomment if you move the secrets into an Environment
    steps:
      # 1) Set up QEMU FIRST (while Docker still exists) ⭐ MOVED UP
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # 2) Free up disk space for Nix (this removes Docker)
      - name: Nothing but Nix (reclaim disk space for /nix)
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "cleave"

      # 3) Generate a token for the GitHub App that is allowed to bypass the ruleset
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      # 4) Checkout repository (credentials stored here are used by the final git push)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # 5) Install Nix with experimental features + ARM support
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            extra-platforms = aarch64-linux
            extra-system-features = nixos-test benchmark big-parallel kvm

      # 6) Restore Nix store from cache (keyed on flake.nix, not flake.lock,
      #    since flake.lock is what this job changes)
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 1209600 # 2 weeks in seconds

      # 7) Show free space & git status
      - name: Show free space & git status
        run: |
          df -h
          git --version
          git status --porcelain --untracked-files=no || true

      # 8) Try full update first
      - name: Update all flake inputs
        id: full-update
        continue-on-error: true
        run: |
          git checkout main || git checkout -b main
          nix flake update
          git --no-pager diff flake.lock || true

      # 9) Check flake after full update
      - name: Check flake (full update)
        id: full-check
        if: steps.full-update.outcome == 'success'
        continue-on-error: true
        run: |
          nix flake check --all-systems

      # 10) If full update failed, rollback and try nixpkgs + nixpkgs-unstable
      - name: Rollback and update nixpkgs + nixpkgs-unstable
        id: dual-update
        if: steps.full-check.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "Full update failed flake check, trying nixpkgs + nixpkgs-unstable update..."
          git restore flake.lock
          nix flake update nixpkgs nixpkgs-unstable
          git --no-pager diff flake.lock || true

      # 11) Check flake after nixpkgs + nixpkgs-unstable update
      - name: Check flake (nixpkgs + nixpkgs-unstable)
        id: dual-check
        if: steps.full-check.outcome == 'failure' && steps.dual-update.outcome == 'success'
        continue-on-error: true
        run: |
          nix flake check --all-systems

      # 12) If nixpkgs + nixpkgs-unstable failed, rollback and try nixpkgs only
      - name: Rollback and update nixpkgs only
        if: steps.dual-check.outcome == 'failure'
        run: |
          echo "nixpkgs + nixpkgs-unstable update failed flake check, trying nixpkgs only..."
          git restore flake.lock
          nix flake update nixpkgs
          git --no-pager diff flake.lock || true

      # 13) Check flake after nixpkgs-only update
      - name: Check flake (nixpkgs only)
        id: single-check
        if: steps.dual-check.outcome == 'failure'
        run: |
          nix flake check --all-systems

      # 14) Determine commit message based on what succeeded
      - name: Set commit message
        id: commit-msg
        run: |
          if [ "${{ steps.full-check.outcome }}" == "success" ]; then
            echo "message=chore(deps): update flake.lock (all inputs)" >> $GITHUB_OUTPUT
          elif [ "${{ steps.dual-check.outcome }}" == "success" ]; then
            echo "message=chore(deps): update flake.lock (nixpkgs + nixpkgs-unstable)" >> $GITHUB_OUTPUT
          else
            echo "message=chore(deps): update flake.lock (nixpkgs only)" >> $GITHUB_OUTPUT
          fi

      # 15) Commit & push with explicit pull/rebase (authenticates as the GitHub App)
      - name: Commit and push flake.lock
        if: steps.full-check.outcome == 'success' || steps.dual-check.outcome == 'success' || steps.single-check.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git add flake.lock
          git stash
          git reset --hard origin/main
          git stash pop
          if ! git diff --quiet flake.lock; then
            git add flake.lock
            git commit --no-verify --signoff -m "${{ steps.commit-msg.outputs.message }}"
            git push origin main
          else
            echo "No changes to commit"
          fi
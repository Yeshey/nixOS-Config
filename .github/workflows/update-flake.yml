name: Auto bump flake.lock
on:
  schedule:
    - cron: "0 6 1,16 * *"
  workflow_dispatch:
concurrency:
  group: bump-flake-lock
  cancel-in-progress: false
permissions:
  contents: read   # pushing is done by the GitHub App token, not GITHUB_TOKEN

env:
  # THE LEVER: "eval" = only evaluate every host (fast)
  #            "build" = fully build every host (slow, catches build failures)
  CHECK_MODE: eval

jobs:
  # Build three candidate lock files and list hosts with their architecture.
  prepare:
    name: Prepare candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
      mode: ${{ env.CHECK_MODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: List hosts and architectures
        id: hosts
        run: |
          hosts=$(nix eval --json --apply 'cs: builtins.attrValues (builtins.mapAttrs (name: c: { host = name; system = c.config.nixpkgs.hostPlatform.system; }) cs)' .#nixosConfigurations)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Create candidate lock files
        run: |
          mkdir locks
          nix flake update || git restore flake.lock
          cp flake.lock locks/full.lock
          git restore flake.lock
          nix flake update nixpkgs nixpkgs-unstable || git restore flake.lock
          cp flake.lock locks/dual.lock
          git restore flake.lock
          nix flake update nixpkgs || git restore flake.lock
          cp flake.lock locks/single.lock

      - uses: actions/upload-artifact@v4
        with:
          name: locks
          path: locks/

  # Stage 1: all inputs
  check-full:
    name: check
    needs: prepare
    uses: ./.github/workflows/check-hosts.yml
    with:
      cand: full
      hosts: ${{ needs.prepare.outputs.hosts }}
      mode: ${{ needs.prepare.outputs.mode }}

  # Stage 2: only if stage 1 failed
  check-dual:
    name: check
    needs: [prepare, check-full]
    if: ${{ !cancelled() && needs.check-full.result == 'failure' }}
    uses: ./.github/workflows/check-hosts.yml
    with:
      cand: dual
      hosts: ${{ needs.prepare.outputs.hosts }}
      mode: ${{ needs.prepare.outputs.mode }}

  # Stage 3: only if stage 2 failed
  check-single:
    name: check
    needs: [prepare, check-dual]
    if: ${{ !cancelled() && needs.check-dual.result == 'failure' }}
    uses: ./.github/workflows/check-hosts.yml
    with:
      cand: single
      hosts: ${{ needs.prepare.outputs.hosts }}
      mode: ${{ needs.prepare.outputs.mode }}

  push:
    name: Commit and push flake.lock
    needs: [prepare, check-full, check-dual, check-single]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@v4
        with:
          name: locks
          path: locks

      - name: Pick candidate
        id: pick
        env:
          FULL: ${{ needs.check-full.result }}
          DUAL: ${{ needs.check-dual.result }}
          SINGLE: ${{ needs.check-single.result }}
        run: |
          if   [ "$FULL" = success ];   then cand=full;   msg="chore(deps): update flake.lock (all inputs)"
          elif [ "$DUAL" = success ];   then cand=dual;   msg="chore(deps): update flake.lock (nixpkgs + nixpkgs-unstable)"
          elif [ "$SINGLE" = success ]; then cand=single; msg="chore(deps): update flake.lock (nixpkgs only)"
          else
            echo "No candidate passed on all hosts (full=$FULL dual=$DUAL single=$SINGLE)"
            exit 1
          fi
          cp "locks/$cand.lock" flake.lock
          echo "message=$msg" >> "$GITHUB_OUTPUT"

      - name: Commit and push flake.lock
        env:
          MSG: ${{ steps.pick.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add flake.lock
          if git diff --cached --quiet -- flake.lock; then
            echo "No changes to commit"
            exit 0
          fi

          git commit --no-verify --signoff -m "$MSG"

          for i in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push failed (attempt $i), rebasing onto origin/main..."
            git pull --rebase origin main
          done
          exit 1

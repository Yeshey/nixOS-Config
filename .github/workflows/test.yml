name: Test push to main
on:
  workflow_dispatch:

concurrency:
  group: test-push-main
  cancel-in-progress: true

permissions:
  contents: read   # the app token does the writing, not GITHUB_TOKEN

jobs:
  test-push:
    runs-on: ubuntu-latest
    # environment: bump   # uncomment if you put the secrets in an Environment
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Toggle TEST.md
        run: |
          if [ -f TEST.md ]; then
            git rm TEST.md
            echo "msg=test: remove TEST.md" >> "$GITHUB_ENV"
          else
            echo "Push test at $(date -u)" > TEST.md
            git add TEST.md
            echo "msg=test: add TEST.md" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --signoff -m "$msg"
          git push origin main